name: Temporary YouTube Livestream Download

on:
  push:
    paths:
      - '.github/workflows/youtube-download-temp.yml'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install downloader dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default,curl-cffi]" curl_cffi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          node --version || true

      - name: Download YouTube livestream
        shell: bash
        run: |
          mkdir -p downloads
          set +e
          URL='https://www.youtube.com/live/GkdzNxLOnYI?si=ZherUmeNlW1PcV3W'
          OUT='downloads/Mix3D_Stylized_VFX_Livestream_Part1.%(ext)s'
          yt-dlp --version | tee downloads/yt-dlp-version.txt

          echo '=== Attempt 1: Chrome impersonation + JS runtime ===' | tee downloads/attempt1.log
          yt-dlp -v \
            --impersonate chrome \
            --js-runtimes node \
            --remote-components ejs:github \
            --no-playlist \
            -f 'bv*[height<=1080]+ba/b[height<=1080]' \
            --merge-output-format mp4 \
            --remux-video mp4 \
            -o "$OUT" \
            "$URL" \
            2>&1 | tee -a downloads/attempt1.log
          s1=${PIPESTATUS[0]}

          if ! find downloads -maxdepth 1 -type f -name '*.mp4' -size +10M | grep -q .; then
            echo '=== Attempt 2: alternate YouTube player clients ===' | tee downloads/attempt2.log
            yt-dlp -v \
              --impersonate chrome \
              --js-runtimes node \
              --remote-components ejs:github \
              --extractor-args 'youtube:player_client=android_vr,web_safari' \
              --no-playlist \
              -f 'bv*[height<=1080]+ba/b[height<=1080]' \
              --merge-output-format mp4 \
              --remux-video mp4 \
              -o "$OUT" \
              "$URL" \
              2>&1 | tee -a downloads/attempt2.log
            s2=${PIPESTATUS[0]}
          else
            s2=0
          fi

          if ! find downloads -maxdepth 1 -type f -name '*.mp4' -size +10M | grep -q .; then
            echo '=== Attempt 3: compatibility 720p fallback ===' | tee downloads/attempt3.log
            yt-dlp -v \
              --impersonate chrome \
              --js-runtimes node \
              --remote-components ejs:github \
              --no-playlist \
              -f 'bv*[height<=720]+ba/b[height<=720]' \
              --merge-output-format mp4 \
              --remux-video mp4 \
              -o "$OUT" \
              "$URL" \
              2>&1 | tee -a downloads/attempt3.log
            s3=${PIPESTATUS[0]}
          else
            s3=0
          fi

          VIDEO=$(find downloads -maxdepth 1 -type f -name '*.mp4' -size +10M | head -n 1)
          echo "attempt statuses: $s1 $s2 $s3" | tee downloads/status.txt
          find downloads -maxdepth 1 -type f -printf '%f %s bytes\n' | tee -a downloads/status.txt

          if [ -n "$VIDEO" ]; then
            echo "VIDEO=$VIDEO" | tee -a downloads/status.txt
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json "$VIDEO" | tee downloads/ffprobe.json
            SIZE=$(stat -c%s "$VIDEO")
            if [ "$SIZE" -gt 1700000000 ]; then
              mkdir -p downloads/split
              split -b 1600M -d -a 2 "$VIDEO" downloads/split/video.part-
              sha256sum "$VIDEO" > downloads/original.sha256
              rm -f "$VIDEO"
            fi
            exit 0
          fi
          exit 1

      - name: Upload direct result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-vfx-part1-result
          path: |
            downloads/*.mp4
            downloads/*.json
            downloads/*.txt
            downloads/*.log
            downloads/*.sha256
          if-no-files-found: warn
          retention-days: 1

      - name: Upload split part 00
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-vfx-part1-part00
          path: downloads/split/video.part-00
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload split part 01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-vfx-part1-part01
          path: downloads/split/video.part-01
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload split part 02
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-vfx-part1-part02
          path: downloads/split/video.part-02
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload split part 03
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-vfx-part1-part03
          path: downloads/split/video.part-03
          if-no-files-found: ignore
          retention-days: 1
