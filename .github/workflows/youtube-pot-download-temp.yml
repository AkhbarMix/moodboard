name: Temporary YouTube PO Token Download

on:
  push:
    paths:
      - '.github/workflows/youtube-pot-download-temp.yml'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install downloader and PO-token provider
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default,curl-cffi]" curl_cffi "bgutil-ytdlp-pot-provider==2.0.2"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          git clone --depth 1 --branch 2.0.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          npm ci
          npx tsc
          node --version
          yt-dlp --version

      - name: Start token server and download livestream
        shell: bash
        run: |
          mkdir -p downloads
          cd /tmp/bgutil/server
          nohup node build/main.js --port 4416 > /tmp/bgutil-server.log 2>&1 &
          echo $! > /tmp/bgutil.pid
          cd "$GITHUB_WORKSPACE"
          sleep 3
          cat /tmp/bgutil-server.log | tee downloads/bgutil-server-start.log
          curl -sS -m 10 http://127.0.0.1:4416/ -o /tmp/bgutil-root.txt -w 'provider HTTP %{http_code}\n' || true
          cat /tmp/bgutil-root.txt 2>/dev/null || true

          URL='https://www.youtube.com/watch?v=GkdzNxLOnYI'
          OUT='downloads/Mix3D_Stylized_VFX_Livestream_Part1.%(ext)s'
          set +e

          yt-dlp --rm-cache-dir 2>&1 | tee downloads/cache-clear.log

          echo '=== Provider verification ===' | tee downloads/provider-check.log
          yt-dlp -v -4 --simulate \
            --js-runtimes node \
            --remote-components ejs:github \
            --extractor-args 'youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416;youtube:player_client=web,android_vr,tv_downgraded' \
            "$URL" 2>&1 | tee -a downloads/provider-check.log

          echo '=== Attempt 1: PO token + web/android_vr/tv_downgraded ===' | tee downloads/attempt1.log
          yt-dlp -v -4 \
            --impersonate chrome \
            --js-runtimes node \
            --remote-components ejs:github \
            --extractor-args 'youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416;youtube:player_client=web,android_vr,tv_downgraded' \
            --no-playlist \
            -f 'bv*[height<=1080]+ba/b[height<=1080]' \
            --merge-output-format mp4 \
            --remux-video mp4 \
            -o "$OUT" \
            "$URL" 2>&1 | tee -a downloads/attempt1.log
          s1=${PIPESTATUS[0]}

          if ! find downloads -maxdepth 1 -type f -name '*.mp4' -size +10M | grep -q .; then
            echo '=== Attempt 2: PO token + mweb/web_safari ===' | tee downloads/attempt2.log
            yt-dlp -v -4 \
              --impersonate chrome \
              --js-runtimes node \
              --remote-components ejs:github \
              --extractor-args 'youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416;youtube:player_client=mweb,web_safari' \
              --no-playlist \
              -f 'bv*[height<=1080]+ba/b[height<=1080]' \
              --merge-output-format mp4 \
              --remux-video mp4 \
              -o "$OUT" \
              "$URL" 2>&1 | tee -a downloads/attempt2.log
            s2=${PIPESTATUS[0]}
          else
            s2=0
          fi

          if ! find downloads -maxdepth 1 -type f -name '*.mp4' -size +10M | grep -q .; then
            echo '=== Attempt 3: HLS/combined fallback through token provider ===' | tee downloads/attempt3.log
            yt-dlp -v -4 \
              --impersonate chrome \
              --js-runtimes node \
              --remote-components ejs:github \
              --extractor-args 'youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416;youtube:player_client=web,ios' \
              --no-playlist \
              -f 'b[height<=1080]/bv*[height<=720]+ba/b' \
              --merge-output-format mp4 \
              --remux-video mp4 \
              -o "$OUT" \
              "$URL" 2>&1 | tee -a downloads/attempt3.log
            s3=${PIPESTATUS[0]}
          else
            s3=0
          fi

          cp /tmp/bgutil-server.log downloads/bgutil-server-full.log || true
          echo "attempt statuses: $s1 $s2 $s3" | tee downloads/status.txt
          find downloads -maxdepth 1 -type f -printf '%f %s bytes\n' | tee -a downloads/status.txt

          VIDEO=$(find downloads -maxdepth 1 -type f -name '*.mp4' -size +10M | head -n 1)
          if [ -n "$VIDEO" ]; then
            echo "VIDEO=$VIDEO" | tee -a downloads/status.txt
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json "$VIDEO" | tee downloads/ffprobe.json
            SIZE=$(stat -c%s "$VIDEO")
            if [ "$SIZE" -gt 1700000000 ]; then
              mkdir -p downloads/split
              split -b 1600M -d -a 2 "$VIDEO" downloads/split/video.part-
              sha256sum "$VIDEO" > downloads/original.sha256
              rm -f "$VIDEO"
            fi
            exit 0
          fi
          exit 1

      - name: Upload result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-vfx-pot-result
          path: |
            downloads/*.mp4
            downloads/*.json
            downloads/*.txt
            downloads/*.log
            downloads/*.sha256
          if-no-files-found: warn
          retention-days: 1

      - name: Upload split part 00
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-vfx-pot-part00
          path: downloads/split/video.part-00
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload split part 01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-vfx-pot-part01
          path: downloads/split/video.part-01
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload split part 02
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-vfx-pot-part02
          path: downloads/split/video.part-02
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload split part 03
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-vfx-pot-part03
          path: downloads/split/video.part-03
          if-no-files-found: ignore
          retention-days: 1
